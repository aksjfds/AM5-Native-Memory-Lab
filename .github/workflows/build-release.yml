name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v[0-9]*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build Windows x64 and test Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install LLVM 18
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang-18 lld-18
          echo '/usr/lib/llvm-18/bin' >> "$GITHUB_PATH"
      - name: Compile existing Linux and Windows targets
        run: |
          mkdir -p ci-validation
          clang --version
          lld-link --version
          python3 -u source/build_builds.py 2>&1 | tee ci-validation/build.log
      - name: Run Linux self-tests and smoke test
        run: |
          source/build/am5lab-linux --self-test 2>&1 | tee ci-validation/linux-selftest.log
          source/build/am5lab-linux --smoke --threads 2 --no-open \
            --config profile.ini --out ci-validation/linux-smoke 2>&1 | tee ci-validation/linux-smoke.log
          python3 scripts/verify_smoke.py ci-validation/linux-smoke --platform Linux
      - name: Package Windows runtime and checksums
        env:
          BUILD_ID: ${{ github.run_number }}.${{ github.run_attempt }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 scripts/package_release.py --commit "$GITHUB_SHA" \
            --build-id "$BUILD_ID" --run-url "$RUN_URL"
          (cd dist && sha256sum --check SHA256SUMS.txt)
      - name: Upload release candidate
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-x64-release-candidate
          path: dist/*
          if-no-files-found: error
          retention-days: 14
      - name: Save Linux validation logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-validation
          path: ci-validation/
          retention-days: 14

  windows-test:
    name: Test packaged executable on Windows
    needs: build
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Check out validation script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download exact build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: dist
          merge-multiple: true
      - name: Verify archive checksums and unpack
        shell: pwsh
        run: |
          foreach ($line in Get-Content 'dist/SHA256SUMS.txt') {
            if ($line -notmatch '^([0-9a-f]{64})  ([A-Za-z0-9._-]+)$') { throw 'Invalid checksum line' }
            $expected = $Matches[1]
            $file = Join-Path 'dist' $Matches[2]
            if ((Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {
              throw "Checksum mismatch: $file"
            }
          }
          Expand-Archive 'dist/AM5MemoryLab-Windows-x64.zip' -DestinationPath 'runtime'
          New-Item -ItemType Directory -Path 'ci-validation' -Force | Out-Null
      - name: Run Windows self-tests
        shell: pwsh
        run: |
          & './runtime/AM5-Native-Memory-Lab/AM5MemoryLab.exe' --self-test 2>&1 |
            Tee-Object -FilePath 'ci-validation/windows-selftest.log'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run Windows smoke test and validate outputs
        shell: pwsh
        run: |
          $runtime = './runtime/AM5-Native-Memory-Lab'
          & "$runtime/AM5MemoryLab.exe" --smoke --threads 2 --no-open `
            --config "$runtime/profile.ini" --out 'ci-validation/Windows smoke 测试' 2>&1 |
            Tee-Object -FilePath 'ci-validation/windows-smoke.log'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/verify_smoke.py 'ci-validation/Windows smoke 测试' --platform Windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Save Windows validation logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-validation
          path: ci-validation/
          retention-days: 14

  release:
    name: Publish tested Windows package
    needs: [build, windows-test]
    # PRs and manual runs on arbitrary branches cannot publish a release.
    if: >-
      github.repository == 'aksjfds/AM5-Native-Memory-Lab' &&
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download the exact tested package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: dist
          merge-multiple: true
      - name: Create Release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && sha256sum --check SHA256SUMS.txt)
          flags=()
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
            flags+=(--verify-tag)
            if [[ "$tag" == *-* ]]; then
              flags+=(--prerelease --latest=false)
            else
              flags+=(--latest)
            fi
          else
            tag="ci-${RUN_NUMBER}-${RUN_ATTEMPT}"
            flags+=(--prerelease --latest=false)
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::Release $tag already exists; existing assets will not be overwritten."
            exit 1
          fi
          cat > release-notes.md <<EOF
          Windows x64 原生程序自动构建。

          - 源码提交：${GITHUB_SHA}
          - 构建与测试记录：${RUN_URL}
          - 已通过 Linux 和 Windows 运行环境的 56 项内核自检及小工作集端到端检查。
          - 下载 AM5MemoryLab-Windows-x64.zip，完整解压后运行 START.cmd。
          - SHA256SUMS.txt 用于校验下载文件；BUILD_INFO.txt 记录源码和编译器信息。

          CI 测试不代表你的 9700X 跑分或内存超频稳定性。程序需要 AVX2，未进行数字签名；无需安装 Python 或编译器。
          EOF
          gh release create "$tag" \
            dist/AM5MemoryLab-Windows-x64.zip dist/BUILD_INFO.txt dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" --title "AM5 Native Memory Lab $tag" \
            --notes-file release-notes.md "${flags[@]}"
          url="$(gh release view "$tag" --json url --jq .url)"
          printf '## Published release\n\n%s\n' "$url" >> "$GITHUB_STEP_SUMMARY"
